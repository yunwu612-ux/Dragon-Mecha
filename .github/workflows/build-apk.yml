name: Build DragonMechaWorkshop APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project version
        shell: bash
        run: |
          grep -q 'versionName = "1.0"' app/build.gradle.kts
          grep -q 'versionCode = 1' app/build.gradle.kts
          echo "DragonMechaWorkshop V1.0 source verification passed."

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonMechaWorkshop-V1.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
